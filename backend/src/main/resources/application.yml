server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:atsdb}
    username: ${DB_USER:atsuser}
    password: ${DB_PASSWORD:atspassword}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt-secret: ${JWT_SECRET:please-change-me-32-bytes-min}
    jwt-expiration-seconds: 3600
  storage:
    resume-dir: ${RESUME_STORAGE_DIR:./data/resumes}
    max-file-size-bytes: 10485760
  scoring:
    keyword-weight: 0.35
    skills-weight: 0.25
    experience-weight: 0.2
    formatting-weight: 0.2

features:
  grammar-insights: false
