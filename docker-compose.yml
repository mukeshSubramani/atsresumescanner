version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-atsuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-atspassword}
      POSTGRES_DB: ${DB_NAME:-atsdb}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-atsdb}
      DB_USER: ${DB_USER:-atsuser}
      DB_PASSWORD: ${DB_PASSWORD:-atspassword}
      JWT_SECRET: ${JWT_SECRET:-please-change-me-32-bytes-min}
    depends_on:
      - db
    ports:
      - "8080:8080"
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  db_data:
